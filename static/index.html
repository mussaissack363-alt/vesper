<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vesper</title>
<style>
  :root {
    --bg: #0a0612;
    --panel: #150e22;
    --panel-alt: #1c1330;
    --purple: #a78bfa;
    --purple-bright: #c4b5fd;
    --purple-dim: #6d5b9e;
    --text: #e9e4f7;
    --text-dim: #9c92b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  #orb-wrap {
    position: relative; height: 34vh; min-height: 200px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #1a1030 0%, #0a0612 75%);
    border-bottom: 1px solid #2a1f42;
  }
  #orb-canvas { width: 100%; height: 100%; }
  #status-label {
    position: absolute; bottom: 12px; left: 0; right: 0; text-align: center;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--purple-dim);
  }

  #chat-log {
    flex: 1; overflow-y: auto; padding: 20px 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; font-size: 14.5px; }
  .msg.user {
    align-self: flex-end; background: linear-gradient(135deg, #7c5cd6, #9b7fe8);
    color: #fff; border-bottom-right-radius: 4px;
  }
  .msg.vesper {
    align-self: flex-start; background: var(--panel-alt);
    border: 1px solid #2e2148; border-bottom-left-radius: 4px;
  }
  .msg.file-note { font-style: italic; color: var(--text-dim); font-size: 13px; }

  #input-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px; background: var(--panel); border-top: 1px solid #2a1f42;
  }
  #input-bar input[type="text"] {
    flex: 1; background: var(--panel-alt); border: 1px solid #33254e;
    color: var(--text); padding: 12px 14px; border-radius: 22px; font-size: 14.5px; outline: none;
  }
  #input-bar input[type="text"]:focus { border-color: var(--purple); }

  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid #33254e;
    background: var(--panel-alt); color: var(--purple); font-size: 16px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    flex-shrink: 0; transition: background 0.15s;
  }
  .icon-btn:hover { background: #2a1f42; }
  .icon-btn.disabled { opacity: 0.35; cursor: not-allowed; }
  .icon-btn.disabled:hover { background: var(--panel-alt); }

  #send-btn {
    background: linear-gradient(135deg, #7c5cd6, #9b7fe8); border: none;
    width: 44px; height: 44px; border-radius: 50%; color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }

  #file-input { display: none; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #33254e; border-radius: 3px; }
</style>
</head>
<body>
<div id="app">

  <div id="orb-wrap">
    <canvas id="orb-canvas"></canvas>
    <div id="status-label">idle</div>
  </div>

  <div id="chat-log"></div>

  <div id="input-bar">
    <div class="icon-btn" id="upload-btn" title="Send image or file">📎</div>
    <input type="file" id="file-input">
    <div class="icon-btn" id="save-btn" title="Save chat">💾</div>
    <div class="icon-btn disabled" id="mic-btn" title="Voice input — coming soon">🎙</div>
    <input type="text" id="msg-input" placeholder="Message Vesper...">
    <div id="send-btn" title="Send">➤</div>
  </div>

</div>

<script>
// ══════════════════════════════════════════
// PARTICLE ORB
// ══════════════════════════════════════════
const canvas = document.getElementById('orb-canvas');
const ctx = canvas.getContext('2d');
let W, H, CX, CY;

function resize() {
  const wrap = document.getElementById('orb-wrap');
  W = canvas.width = wrap.clientWidth;
  H = canvas.height = wrap.clientHeight;
  CX = W / 2; CY = H / 2;
}
window.addEventListener('resize', resize);
resize();

let energy = 0.15;      // 0 = idle, 1 = speaking/thinking
let targetEnergy = 0.15;

const rings = [];
const NUM_RINGS = 5;
for (let i = 0; i < NUM_RINGS; i++) {
  rings.push({
    radius: 40 + i * 22,
    speed: (Math.random() * 0.6 + 0.2) * (i % 2 === 0 ? 1 : -1),
    angle: Math.random() * Math.PI * 2,
    tilt: Math.random() * 0.6 + 0.2,
    dotCount: 30 + i * 6,
  });
}

const particles = [];
const NUM_PARTICLES = 60;
for (let i = 0; i < NUM_PARTICLES; i++) {
  particles.push({
    angle: Math.random() * Math.PI * 2,
    dist: Math.random() * 140 + 30,
    speed: (Math.random() * 0.3 + 0.05) * (Math.random() < 0.5 ? 1 : -1),
    size: Math.random() * 1.8 + 0.6,
    twinkle: Math.random() * Math.PI * 2,
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  energy += (targetEnergy - energy) * 0.06;

  const baseR = Math.min(W, H) * 0.16;
  const pulse = 1 + Math.sin(Date.now() / 400) * 0.03 * (0.4 + energy);

  const coreR = baseR * pulse * (0.7 + energy * 0.4);
  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, coreR * 2.2);
  grad.addColorStop(0, `rgba(196,181,253,${0.55 + energy * 0.3})`);
  grad.addColorStop(0.4, `rgba(167,139,250,${0.25 + energy * 0.2})`);
  grad.addColorStop(1, 'rgba(167,139,250,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(CX, CY, coreR * 2.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = `rgba(233,228,247,${0.85})`;
  ctx.beginPath();
  ctx.arc(CX, CY, coreR * 0.32, 0, Math.PI * 2);
  ctx.fill();

  rings.forEach(r => {
    r.angle += 0.004 * r.speed * (1 + energy * 1.5);
    ctx.save();
    ctx.translate(CX, CY);
    ctx.scale(1, r.tilt);
    ctx.strokeStyle = `rgba(167,139,250,${0.18 + energy * 0.15})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r.radius * (0.9 + energy * 0.25), 0, Math.PI * 2);
    ctx.stroke();

    for (let d = 0; d < r.dotCount; d++) {
      const a = r.angle + (d / r.dotCount) * Math.PI * 2;
      const rad = r.radius * (0.9 + energy * 0.25);
      const x = Math.cos(a) * rad;
      const y = Math.sin(a) * rad;
      const alpha = 0.3 + 0.5 * Math.sin(a * 3 + Date.now() / 500);
      ctx.fillStyle = `rgba(196,181,253,${Math.max(0, alpha) * (0.5 + energy * 0.5)})`;
      ctx.beginPath();
      ctx.arc(x, y, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });

  particles.forEach(p => {
    p.angle += p.speed * 0.01 * (1 + energy);
    p.twinkle += 0.03;
    const x = CX + Math.cos(p.angle) * p.dist * (0.9 + energy * 0.3);
    const y = CY + Math.sin(p.angle) * p.dist * 0.6 * (0.9 + energy * 0.3);
    const tw = 0.3 + 0.5 * Math.abs(Math.sin(p.twinkle));
    ctx.fillStyle = `rgba(196,181,253,${tw})`;
    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(draw);
}
draw();

function setOrbState(state) {
  const label = document.getElementById('status-label');
  if (state === 'thinking') { targetEnergy = 0.9; label.textContent = 'thinking'; }
  else if (state === 'speaking') { targetEnergy = 1.0; label.textContent = 'speaking'; }
  else { targetEnergy = 0.15; label.textContent = 'idle'; }
}

// ══════════════════════════════════════════
// CHAT
// ══════════════════════════════════════════
const chatLog = document.getElementById('chat-log');
const msgInput = document.getElementById('msg-input');

function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = `msg ${who}`;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = '';
  addMessage(text, 'user');
  setOrbState('thinking');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    setOrbState('speaking');
    addMessage(data.reply || '(no reply)', 'vesper');
  } catch (err) {
    addMessage(`Connection error: ${err}`, 'vesper');
  } finally {
    setTimeout(() => setOrbState('idle'), 1200);
  }
}

document.getElementById('send-btn').addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

const fileInput = document.getElementById('file-input');
document.getElementById('upload-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  addMessage(`Sent file: ${file.name}`, 'user');
  const formData = new FormData();
  formData.append('file', file);
  setOrbState('thinking');
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    setOrbState('speaking');
    addMessage(data.reply, 'vesper');
  } catch (err) {
    addMessage(`Upload error: ${err}`, 'vesper');
  } finally {
    setTimeout(() => setOrbState('idle'), 1200);
    fileInput.value = '';
  }
});

document.getElementById('save-btn').addEventListener('click', () => {
  const lines = [...chatLog.querySelectorAll('.msg')].map(el => {
    const who = el.classList.contains('user') ? 'You' : 'Vesper';
    return `${who}: ${el.textContent}`;
  });
  const blob = new Blob([lines.join('\n\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `vesper-chat-${Date.now()}.txt`;
  a.click();
});

document.getElementById('mic-btn').addEventListener('click', () => {
  addMessage('Voice input isn\'t wired up yet — this button is a placeholder for now.', 'vesper');
});

addMessage('Vesper online. Ready when you are.', 'vesper');
</script>
</body>
</html>
